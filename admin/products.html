<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">Admin Panel</div>
            <ul class="sidebar-nav">
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="orders.html">Orders</a></li>
                <li><a href="customers.html">Customers</a></li> </ul>
            </ul>
            <div class="sidebar-footer">
                <a href="../index.html">Back to Shop</a>
            </div>
        </aside>
        <main class="main-content">
            <div class="header-action">
                <h1>Manage Products</h1>
                <a href="add-product.html" class="btn">Add New Product</a>
            </div>
            <div class="search-container">
                <form>
                    <input type="text" class="search-input" placeholder="Search for products by name...">
                    <button type="submit" class="btn search-btn">Search</button>
                </form>
            </div>
            <table class="content-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Product Name</th>
                        <th>Brand</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="../assets/images/mau-banner-giay-nu-1.jpg" alt="Product Image" class="product-image-thumbnail"></td>
                        <td>Balenciaga Triple S Orange Grey</td>
                        <td>Balenciaga</td>
                        <td>888,000₫</td>
                        <td class="action-buttons">
                            <a href="edit-product.html" class="edit-btn">Edit</a>
                            <a href="#" class="delete-btn">Delete</a>
                        </td>
                    </tr>
                    <tr>
                        <td><img src="../assets/images/mau-banner-giay-nu-1.jpg" alt="Product Image" class="product-image-thumbnail"></td>
                        <td>H-FORCE BLUE</td>
                        <td>Local Brand</td>
                        <td>1,190,000₫</td>
                        <td class="action-buttons">
                            <a href="edit-product.html" class="edit-btn">Edit</a>
                            <a href="#" class="delete-btn">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </main>
    </div>
</body>
</html>
