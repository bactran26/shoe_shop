<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Phiếu Nhập Hàng</title>
    <link rel="stylesheet" href="./assets/css/admin-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/themfisher/themify-icons@1.0.0/css/themify-icons.css">
</head>
<body>

    <a href="../index.html" class="view-site-button">
        <i class="ti-world"></i> Xem Trang Web
    </a>

    <header class="admin-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="dashboard.html">
                    <img src="../assets/images/new-logo-ss-2021-1-150x63.png.avif" alt="Site Logo">
                </a>
            </div>
            <nav class="admin-nav">
                <ul class="nav-menu">
                    <li><a href="dashboard.html">Tổng Quan</a></li>
                    <li><a href="manage-users.html">Quản Lý Khách Hàng</a></li>
                    <li><a href="manage-categories.html">Quản Lý Loại Sản Phẩm</a></li>
                    <li><a href="manage-products.html">Quản Lý Sản Phẩm</a></li>
                    <li class="active"><a href="manage-imports.html">Quản Lý Nhập Hàng</a></li>
                    <li><a href="manage-pricing.html">Quản Lý Giá Bán</a></li>
                    <li><a href="manage-orders.html">Quản Lý Đơn Hàng</a></li>
                    <li><a href="manage-inventory.html">Quản Lý Tồn Kho</a></li>
                    <li><a href="login.html">Đăng Xuất</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="admin-wrapper">
        <main class="main-content">
            <header class="main-header">
                <h1>Sửa Phiếu Nhập Hàng #PN002</h1>
            </header>
            <div class="content-body">
                <div class="card">
                    <form id="import-form">
                        <div class="input-group">
                            <label for="import-date">Ngày nhập</label>
                            <input type="date" id="import-date" value="2025-10-18" required>
                        </div>
                        <hr style="margin: 20px 0;">
                        <h3>Chi Tiết Sản Phẩm Nhập</h3>
                        
                        <div id="product-list">
                            <div class="product-entry">
                                <select class="product-selector">
                                    <option value="">-- Chọn sản phẩm --</option>
                                    <option value="NK001" selected>H-FORCE BLUE / - 43</option>
                                    <option value="BLG002">Balenciaga Triple S</option>
                                </select>
                                <input type="number" class="product-quantity" placeholder="Số lượng" min="1" value="100">
                                <div class="price-input-wrapper">
                                    <input type="text" class="product-cost" placeholder="Giá nhập" inputmode="numeric" value="850.000">
                                    <span>VNĐ</span>
                                </div>
                                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Xóa</button>
                            </div>
                            <div class="product-entry">
                                <select class="product-selector">
                                    <option value="">-- Chọn sản phẩm --</option>
                                    <option value="NK001">H-FORCE BLUE / - 43</option>
                                    <option value="BLG002" selected>Balenciaga Triple S</option>
                                </select>
                                <input type="number" class="product-quantity" placeholder="Số lượng" min="1" value="100">
                                <div class="price-input-wrapper">
                                    <input type="text" class="product-cost" placeholder="Giá nhập" inputmode="numeric" value="600.000">
                                    <span>VNĐ</span>
                                </div>
                                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Xóa</button>
                            </div>
                        </div>

                        <button type="button" class="btn btn-sm" onclick="addProductEntry()">Thêm sản phẩm</button>
                        
                        <div class="form-actions" style="margin-top: 20px;">
                            <button type="submit" class="btn">Cập Nhật Phiếu Nhập</button>
                            <a href="manage-imports.html" class="btn btn-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        function formatPrice(value) {
            let num = value.replace(/[^0-9]/g, '');
            if (num === '') return '';
            return new Intl.NumberFormat('vi-VN').format(num);
        }

        function applyPriceFormatting(input) {
            input.addEventListener('input', (e) => {
                let value = e.target.value;
                let selectionStart = e.target.selectionStart;
                let originalLength = value.length;

                let formattedValue = formatPrice(value);
                e.target.value = formattedValue;

                let newLength = formattedValue.length;
                let newCursorPos = selectionStart + (newLength - originalLength);
                e.target.setSelectionRange(newCursorPos, newCursorPos);
            });
        }

        function addProductEntry() {
            const list = document.getElementById('product-list');
            const newEntry = document.createElement('div');
            newEntry.className = 'product-entry';
            newEntry.innerHTML = `
                <select class="product-selector">
                    <option value="">-- Chọn sản phẩm --</option>
                    <option value="NK001">H-FORCE BLUE / - 43</option>
                    <option value="BLG002">Balenciaga Triple S</option>
                    <option value="AD005">Adidas Stan Smith</option>
                </select>
                <input type="number" class="product-quantity" placeholder="Số lượng" min="1">
                <div class="price-input-wrapper">
                    <input type="text" class="product-cost" placeholder="Giá nhập" inputmode="numeric">
                    <span>VNĐ</span>
                </div>
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove()">Xóa</button>
            `;
            list.appendChild(newEntry);

            applyPriceFormatting(newEntry.querySelector('.product-cost'));
        }

        document.querySelectorAll('.product-cost').forEach(applyPriceFormatting);

        document.getElementById('import-form').addEventListener('submit', (e) => {
            document.querySelectorAll('.product-cost').forEach(input => {
                input.value = input.value.replace(/\./g, '');
            });
        });
    </script>

    <style>
        .product-entry {
            display: grid;
            grid-template-columns: 3fr 1fr 1.5fr auto;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        .product-entry .product-selector, 
        .product-entry .product-quantity {
            width: 100%;
        }
        
        .price-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .price-input-wrapper input.product-cost {
            width: 100%;
            padding-right: 50px; 
            box-sizing: border-box; 
        }
        .price-input-wrapper span {
            position: absolute;
            right: 15px;
            color: #888;
            font-size: 14px;
        }
    </style>
</body>
</html>
