<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sửa Giá Sản Phẩm</title>
    <link rel="stylesheet" href="./assets/css/admin-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/themfisher/themify-icons@1.0.0/css/themify-icons.css">
</head>
<body>

    <a href="../index.html"  class="view-site-button">
        <i class="ti-world"></i> Xem Trang Web
    </a>

    <header class="admin-header">
        <div class="header-container">
            <div class="header-logo">
                <a href="dashboard.html">
                    <img src="../assets/images/new-logo-ss-2021-1-150x63.png.avif" alt="Site Logo">
                </a>
            </div>
            <nav class="admin-nav">
                <ul class="nav-menu">
                    <li><a href="dashboard.html">Tổng Quan</a></li>
                    <li><a href="manage-users.html">Quản Lý Khách Hàng</a></li>
                    <li><a href="manage-categories.html">Quản Lý Loại Sản Phẩm</a></li>
                    <li><a href="manage-products.html">Quản Lý Sản Phẩm</a></li>
                    <li><a href="manage-imports.html">Quản Lý Nhập Hàng</a></li>
                    <li class="active"><a href="manage-pricing.html">Quản Lý Giá Bán</a></li>
                    <li><a href="manage-orders.html">Quản Lý Đơn Hàng</a></li>
                    <li><a href="manage-inventory.html">Quản Lý Tồn Kho</a></li>
                    <li><a href="login.html">Đăng Xuất</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="admin-wrapper">
        <main class="main-content">
            <header class="main-header">
                <h1>Sửa Giá Sản Phẩm</h1>
            </header>
            <div class="content-body">
                <div class="card">
                    <form action="manage-pricing.html">
                        <div class="input-group">
                            <label>Sản phẩm</label>
                            <input type="text" value="H-FORCE BLUE / - 43" readonly style="background-color: #f0f0f0;">
                        </div>
                        <div class="input-group">
                            <label>Giá Vốn (từ phiếu nhập gần nhất)</label>
                            <input type="text" value="850.000₫" readonly style="background-color: #f0f0f0;">
                        </div>
                        <div class="input-group">
                            <label for="profit-percent">Tỉ Lệ Lợi Nhuận (%)</label>
                            <input type="number" id="profit-percent" value="48" placeholder="Nhập % lợi nhuận (ví dụ: 50)">
                            <small style="margin-top: 5px;">* Bỏ trống để dùng tỉ lệ mặc định của loại sản phẩm (40%).</small>
                        </div>
                        
                        <div class="form-actions">
                            <button type="submit" class="btn">Lưu Thay Đổi</button>
                            <a href="manage-pricing.html" class="btn btn-secondary">Hủy</a>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
