<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Tất cả sản phẩm - Shoe Shop</title>

    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/products.css" />
    <link rel="stylesheet" href="assets/css/search.css" />
    <link
      rel="stylesheet"
      href="assets/fonts/themify-icons/themify-icons.css"
    />
  </head>
  <body>
    <div id="header">
      <div class="header-topbar">
        <div class="header-container">
          <div class="header-hotline">
            Hotline: 0903.150.443 | Free Ship cho đơn hàng trên 1tr đồng
          </div>
        </div>
      </div>
      <div class="header-wrapper-middle">
        <div class="header-container">
          <div class="header-middle">
            <div class="header-logo">
              <a href="index.html"
                ><img
                  src="assets/images/new-logo-ss-2021-1-150x63.png.avif"
                  alt="logo"
              /></a>
            </div>
            <div class="header-search">
              <form
                class="header-input-search"
                method="get"
                action="products.html"
                onsubmit="return validateSearch(event)"
              >
                <input
                  type="text"
                  name="q"
                  class="input-search"
                  placeholder="Search for products"
                />
                <button class="button-search" type="submit">
                  <i class="ti-search"></i>
                </button>
              </form>
            </div>
            <div class="header-right">
              <div class="header-user">
                <a href="user-infor.html"><i class="ti-user"></i></a>
              </div>
              <div class="header-cart">
                <a href="showcart.html"><i class="ti-shopping-cart"></i></a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <main class="products-section">
      <h2 id="searchHeading" class="section-title">TẤT CẢ SẢN PHẨM</h2>
      <div class="products-grid" id="productGrid">
        <a
          class="product-card"
          href="product-details.html?id=1"
          data-name="h-force blue"
        >
          <div class="product-image">
            <img src="assets/images/giay1.jpg" alt="H-FORCE BLUE" />
          </div>
          <div class="product-info">
            <h3 class="product-name">H-FORCE BLUE - 43</h3>
            <div class="product-price">1.190.000₫</div>
          </div>
        </a>

        <a
          class="product-card"
          href="product-details.html?id=2"
          data-name="balenciaga triple s"
        >
          <div class="product-image">
            <img src="assets/images/giay.jpg" alt="Balenciaga Triple S" />
          </div>
          <div class="product-info">
            <h3 class="product-name">Balenciaga Triple S - 37</h3>
            <div class="product-price">888.000₫</div>
          </div>
        </a>

        <a
          class="product-card"
          href="product-details.html?id=3"
          data-name="nike air max"
        >
          <div class="product-image">
            <img
              src="assets/images/maxresdefault-qgjqygbo0wpjtxt8m1249ugbvf9cqm2yyx28d1t11k.jpg"
              alt="Nike Air Max"
            />
          </div>
          <div class="product-info">
            <h3 class="product-name">Nike Air Max - 42</h3>
            <div class="product-price">1.500.000₫</div>
          </div>
        </a>
      </div>
    </main>

    <div id="footer-section">
      <div class="footer-copyright"><p>Saigonsneaker.com © 2025</p></div>
    </div>

    <script src="assets/js/validate.js"></script>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const q = params.get("q");
        if (!q) return;
        document.getElementById(
          "searchHeading"
        ).textContent = `Kết quả tìm kiếm cho: "${q}"`;
        const key = q.trim().toLowerCase();
        document
          .querySelectorAll("#productGrid .product-card")
          .forEach((it) => {
            const name = (
              it.dataset.name ||
              it.textContent ||
              ""
            ).toLowerCase();
            if (!name.includes(key)) it.style.display = "none";
          });
      })();
    </script>
  </body>
</html>
